<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="config.js"></script>
<title>Topmix - Catálogo de Produtos</title>
<meta name="description" content="Catálogo completo de soldas, abrasivos e tintas da Topmix. Pesquise, monte seu orçamento e envie direto pelo WhatsApp.">
<link rel="icon" id="favicon-link" href="">
<link rel="manifest" id="manifest-link">
<link rel="apple-touch-icon" id="apple-touch-icon" href="">
<meta name="theme-color" id="meta-theme-color" content="#141b28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" id="apple-mobile-web-app-title" content="Catálogo">
<script>
(function () {
  "use strict";
  if (typeof SITE_CONFIG === "undefined") return;

  // Cores da marca (sobrescreve as variáveis CSS via estilo inline no <html>,
  // isso sempre "ganha" da folha de estilos, então funciona mesmo antes dela carregar)
  if (SITE_CONFIG.cores) {
    Object.keys(SITE_CONFIG.cores).forEach(function (chave) {
      document.documentElement.style.setProperty("--" + chave, SITE_CONFIG.cores[chave]);
    });
  }

  // Favicon
  var favicon = document.getElementById("favicon-link");
  if (favicon && SITE_CONFIG.logoBase64) favicon.href = SITE_CONFIG.logoBase64;

  // PWA: monta o manifest.json "na hora" (usando os dados do config.js),
  // assim o catálogo pode virar um app instalável sem precisar de um
  // segundo arquivo pra manter atualizado a cada cliente novo.
  if (SITE_CONFIG.logoBase64) {
    var corFundo = (SITE_CONFIG.cores && SITE_CONFIG.cores["navy-900"]) ? SITE_CONFIG.cores["navy-900"] : "#141b28";
    var nomeApp = SITE_CONFIG.nome || "Catálogo";
    var nomeInstalado = SITE_CONFIG.nomeInstalado || "Catálogo";
    var dadosManifest = {
      name: nomeApp + " - Catálogo de Produtos",
      short_name: nomeInstalado,
      start_url: new URL("index.html", location.href).href,
      scope: new URL(".", location.href).href,
      display: "standalone",
      background_color: corFundo,
      theme_color: corFundo,
      icons: [
        { src: SITE_CONFIG.logoBase64, sizes: "192x192", type: "image/webp", purpose: "any" },
        { src: SITE_CONFIG.logoBase64, sizes: "512x512", type: "image/webp", purpose: "any" }
      ]
    };
    var blobManifest = new Blob([JSON.stringify(dadosManifest)], { type: "application/json" });
    document.getElementById("manifest-link").href = URL.createObjectURL(blobManifest);
    document.getElementById("apple-touch-icon").href = SITE_CONFIG.logoBase64;
    document.getElementById("meta-theme-color").setAttribute("content", corFundo);
    document.getElementById("apple-mobile-web-app-title").setAttribute("content", nomeInstalado);
  }

  // Título da aba e descrição (SEO)
  if (SITE_CONFIG.tituloAba) document.title = SITE_CONFIG.tituloAba;
  var metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc && SITE_CONFIG.descricaoMeta) metaDesc.setAttribute("content", SITE_CONFIG.descricaoMeta);

  // Google Analytics (opcional -- só carrega se um ID foi configurado)
  if (SITE_CONFIG.googleAnalyticsId) {
    var scriptGA = document.createElement("script");
    scriptGA.async = true;
    scriptGA.src = "https://www.googletagmanager.com/gtag/js?id=" + SITE_CONFIG.googleAnalyticsId;
    document.head.appendChild(scriptGA);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { window.dataLayer.push(arguments); };
    window.gtag("js", new Date());
    window.gtag("config", SITE_CONFIG.googleAnalyticsId);
  }

  // Registra o service worker (deixa o catálogo instalável e funcionando
  // mesmo com internet ruim). Precisa do arquivo sw.js na mesma pasta.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>

<style>
  :root{
    --navy-900:#141b28;
    --navy-800:#1f2a38;
    --navy-600:#4a5467;
    --gray-100:#f6f7f9;
    --gray-200:#e7ebf0;
    --gray-400:#94a3b8;
    --gold:#ffd035;
    --orange:#ff801a;
    --whatsapp:#25d366;
    --whatsapp-dark:#1ebe5b;
    --white:#ffffff;
    --radius:10px;
    --shadow-sm:0 1px 3px rgba(20,27,40,.08);
    --shadow-md:0 10px 28px rgba(20,27,40,.12);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--gray-100);
    color:var(--navy-800);
    padding-bottom:4.5rem;
  }
  .faixa-topo{height:5px;background:linear-gradient(90deg,var(--orange),var(--gold));}

  header.topo{
    background:var(--white);
    padding:1.5rem 1rem 1.25rem;
    text-align:center;
    box-shadow:var(--shadow-sm);
  }
  header.topo img{max-width:220px;width:100%;height:auto;display:block;margin:0 auto .6rem;}
  header.topo p{margin:0;color:var(--navy-600);font-size:.95rem;}

  .barra-busca-wrap{
    position:sticky;top:0;z-index:80;
    background:var(--gray-100);
    padding:.55rem 1rem;
    border-bottom:1px solid var(--gray-200);
  }
  .barra-busca{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:.35rem;}
  .campo-busca{position:relative;}
  .campo-busca span{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);font-size:.9rem;opacity:.6;pointer-events:none;}
  #campo-pesquisa{
    width:100%;padding:.6rem .9rem .6rem 2.2rem;font-size:.9rem;
    border:1.5px solid var(--gray-200);border-radius:8px;outline:none;
    background:var(--white);color:var(--navy-800);
    -webkit-appearance:none;
  }
  #campo-pesquisa:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,128,26,.15);}
  #filtro-categoria{
    width:100%;padding:.5rem .7rem;font-size:.82rem;font-weight:600;color:var(--navy-800);
    border:1.5px solid var(--gray-200);border-radius:8px;background:var(--white);outline:none;
  }
  #filtro-categoria:focus{border-color:var(--orange);}
  .linha-categoria-carrinho{display:flex;align-items:center;gap:.5rem;}
  .linha-categoria-carrinho #filtro-categoria{flex:1;}
  .linha-info{display:flex;align-items:center;justify-content:space-between;gap:.5rem;}
  .contador{font-size:.78rem;color:var(--navy-600);font-weight:600;padding-left:.15rem;}
  .btn-pdf{
    background:var(--white);color:var(--navy-800);border:1.5px solid var(--gray-200);
    padding:.35rem .65rem;border-radius:7px;font-size:.74rem;font-weight:700;
    cursor:pointer;white-space:nowrap;flex-shrink:0;
  }
  .btn-pdf:hover{border-color:var(--orange);}
  .btn-pdf:disabled{opacity:.6;cursor:wait;}

  @media (min-width:640px){
    .barra-busca{flex-direction:row;flex-wrap:wrap;align-items:center;}
    .campo-busca{flex:1 1 260px;}
    .linha-categoria-carrinho{flex:0 0 auto;}
    .linha-categoria-carrinho #filtro-categoria{width:210px;flex:0 0 210px;}
    .linha-info{flex:1 1 100%;}
  }

  main.grid{
    max-width:1200px;margin:1.25rem auto 0;padding:0 1rem;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem;
  }

  .produto-card{
    background:var(--white);border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow-sm);border:1px solid var(--gray-200);
    display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s,border-color .15s;
  }
  .produto-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .produto-card.no-carrinho{border-color:var(--whatsapp);box-shadow:0 0 0 2px rgba(37,211,102,.22);}

  .badge-carrinho{
    position:absolute;top:6px;right:6px;z-index:2;
    background:var(--whatsapp);color:var(--white);
    font-size:.68rem;font-weight:800;padding:.25rem .5rem;border-radius:999px;
    display:none;align-items:center;gap:.25rem;box-shadow:var(--shadow-sm);
  }
  .produto-card.no-carrinho .badge-carrinho{display:inline-flex;}

  .produto-imagem-container{
    position:relative;width:100%;height:150px;background:var(--gray-100);
    display:flex;align-items:center;justify-content:center;
    border-bottom:1px solid var(--gray-200);overflow:hidden;
  }
  .img-placeholder{font-size:2.1rem;opacity:.35;}
  .produto-foto{
    position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px;
    background:var(--white);opacity:0;transition:opacity .25s;
  }
  .produto-foto.carregada{opacity:1;}

  .produto-info{padding:.9rem;display:flex;flex-direction:column;flex-grow:1;gap:.55rem;}
  .produto-codigo{
    align-self:flex-start;background:var(--navy-800);color:var(--white);
    font-size:.7rem;font-weight:700;letter-spacing:.03em;
    padding:.2rem .5rem;border-radius:4px;
  }
  .produto-descricao{
    font-size:.87rem;font-weight:600;color:var(--navy-900);
    margin:0;line-height:1.35;flex-grow:1;min-height:2.4em;
  }
  .produto-preco{display:none;align-items:center;gap:.45rem;flex-wrap:wrap;}
  .produto-preco .preco-antigo{font-size:.76rem;color:var(--gray-400);text-decoration:line-through;}
  .produto-preco .preco-atual{font-size:1.1rem;font-weight:800;color:var(--navy-900);}
  .produto-preco .etiqueta-oferta{
    background:var(--orange);color:var(--white);font-size:.64rem;font-weight:800;
    padding:.18rem .45rem;border-radius:4px;letter-spacing:.02em;white-space:nowrap;
  }

  .stepper{display:flex;align-items:stretch;border:1.5px solid var(--gray-200);border-radius:7px;overflow:hidden;height:38px;}
  .btn-qtd{
    width:38px;border:none;background:var(--gray-100);color:var(--navy-800);
    font-size:1.15rem;font-weight:700;cursor:pointer;flex-shrink:0;
  }
  .btn-qtd:active{background:var(--gray-200);}
  .qtd-input-card{
    flex-grow:1;min-width:0;border:none;border-left:1.5px solid var(--gray-200);border-right:1.5px solid var(--gray-200);
    text-align:center;font-size:.95rem;font-weight:600;color:var(--navy-800);
  }

  .mensagem-flutuante{
    position:fixed;left:50%;bottom:4.8rem;transform:translate(-50%, 12px);
    background:var(--navy-900);color:var(--white);
    padding:.65rem 1.1rem;border-radius:8px;font-size:.85rem;font-weight:600;
    box-shadow:var(--shadow-md);z-index:150;max-width:90%;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
  }
  .mensagem-flutuante.visivel{opacity:1;transform:translate(-50%, 0);}

  .btn-add{
    background:linear-gradient(90deg,var(--orange),var(--gold));
    color:var(--navy-900);border:none;padding:.6rem;border-radius:7px;
    font-weight:700;font-size:.85rem;cursor:pointer;transition:filter .15s,transform .1s;
  }
  .btn-add:hover{filter:brightness(1.05);}
  .btn-add:active{transform:scale(.98);}
  .btn-add.confirmado{background:var(--navy-800);color:var(--white);}
  .btn-add.no-carrinho{background:var(--whatsapp);color:var(--white);}

  .vazio{grid-column:1/-1;text-align:center;padding:3rem 1rem;color:var(--navy-600);background:var(--white);border-radius:var(--radius);border:1px solid var(--gray-200);}
  .sentinela{height:1px;}

  .barra-carrinho{display:none;}

  .carrinho-flutuante{
    position:relative;flex-shrink:0;
    width:44px;height:44px;border-radius:50%;border:none;
    background:var(--navy-900);color:var(--white);
    display:flex;align-items:center;justify-content:center;font-size:1.2rem;
    box-shadow:var(--shadow-sm);cursor:pointer;
  }
  .carrinho-flutuante:hover{filter:brightness(1.15);}
  .carrinho-badge{
    position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;
    background:var(--orange);color:var(--navy-900);border-radius:999px;
    font-size:.65rem;font-weight:800;display:flex;align-items:center;justify-content:center;
    border:2px solid var(--white);
  }

  .btn-topo{
    position:fixed;right:1rem;bottom:4.6rem;z-index:90;width:42px;height:42px;border-radius:50%;
    background:var(--white);border:1px solid var(--gray-200);box-shadow:var(--shadow-md);
    font-size:1.1rem;cursor:pointer;color:var(--navy-800);display:none;align-items:center;justify-content:center;
  }
  .btn-topo.visivel{display:flex;}

  .modal{display:none;position:fixed;inset:0;background:rgba(20,27,40,.6);z-index:200;justify-content:center;align-items:center;padding:1rem;}
  .modal.aberto{display:flex;}
  .modal-content{background:var(--white);border-radius:var(--radius);width:100%;max-width:680px;max-height:88vh;overflow-y:auto;padding:1.5rem;}
  .modal-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--gray-200);padding-bottom:.9rem;margin-bottom:1rem;}
  .modal-header h2{margin:0;font-size:1.15rem;color:var(--navy-900);}
  .btn-fechar-x{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--navy-600);line-height:1;padding:.2rem .4rem;}

  .tabela-orcamento{width:100%;border-collapse:collapse;margin-bottom:.6rem;font-size:.88rem;}
  #tabela-orcamento.ocultar-precos .col-preco-orcamento{display:none;}
  .total-orcamento{text-align:right;font-weight:800;font-size:1rem;color:var(--navy-900);margin:0 0 1.1rem;}
  .tabela-orcamento th{text-align:left;padding:.5rem .4rem;border-bottom:2px solid var(--gray-200);color:var(--navy-600);font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;}
  .tabela-orcamento td{padding:.55rem .4rem;border-bottom:1px solid var(--gray-200);vertical-align:middle;}
  .qtd-input{width:56px;padding:.35rem;text-align:center;border:1.5px solid var(--gray-200);border-radius:5px;}
  .btn-remover{background:#fee2e2;color:#b91c1c;border:none;padding:.4rem .6rem;border-radius:5px;cursor:pointer;font-weight:600;font-size:.78rem;white-space:nowrap;}

  .secao-vendedores{background:var(--gray-100);padding:1.1rem;border-radius:8px;margin-bottom:1rem;text-align:center;}
  .secao-vendedores p{font-weight:700;margin:0 0 .7rem;color:var(--navy-900);font-size:.9rem;}
  .botoes-vendedores{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;}
  .btn-whatsapp{background:var(--whatsapp);color:var(--white);border:none;padding:.7rem 1.1rem;border-radius:7px;font-weight:700;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:.45rem;}
  .btn-whatsapp:hover{background:var(--whatsapp-dark);}
  .rodape-modal{display:flex;gap:.6rem;flex-wrap:wrap;}
  .btn-limpar{background:none;border:1.5px solid var(--gray-200);color:var(--navy-600);padding:.7rem 1rem;border-radius:7px;cursor:pointer;font-weight:600;font-size:.85rem;flex:1;}
  .btn-continuar{background:var(--navy-800);color:var(--white);border:none;padding:.7rem 1rem;border-radius:7px;cursor:pointer;font-weight:600;font-size:.85rem;flex:2;}

  @media (max-width:480px){
    main.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem;}
    .produto-imagem-container{height:110px;}
  }

  #area-impressao{display:none;}
  @media print{
    @page{margin:12mm;}
    *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;color-adjust:exact !important;}
    body *{visibility:hidden;}
    #area-impressao, #area-impressao *{visibility:visible;}
    #area-impressao{display:block;position:absolute;top:0;left:0;width:100%;}
    .capa-pdf{page-break-after:always;text-align:center;padding-top:18%;}
    .capa-pdf img{max-width:280px;margin-bottom:2rem;}
    .capa-pdf .titulo-destaque{font-size:2.6rem;font-weight:800;color:var(--orange);letter-spacing:.02em;line-height:1.15;}
    .capa-pdf .titulo-principal{font-size:2.6rem;font-weight:800;color:var(--navy-900);letter-spacing:.02em;line-height:1.15;margin-bottom:.9rem;}
    .capa-pdf p{color:var(--navy-600);font-size:1.05rem;margin:.2rem 0;letter-spacing:.05em;}
    .categoria-pdf-titulo{
      font-size:1.1rem;font-weight:800;color:var(--white);background:var(--navy-800);
      padding:.4rem 6mm;margin:.6rem 0 .3rem;text-transform:uppercase;letter-spacing:.04em;
      break-after:avoid;break-inside:avoid;
    }

    .categoria-pdf-titulo.nova-pagina{page-break-before:always;break-before:page;}
    .pagina-foto-cheia{page-break-after:always;text-align:center;}
    .pagina-foto-cheia.contracapa{page-break-before:always;page-break-after:auto;}
    .pagina-foto-cheia img{width:100%;height:auto;display:block;}
    .lista-pdf{display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;padding:0 6mm;}
    .item-pdf{display:flex;gap:.7rem;align-items:center;border-bottom:1px solid var(--gray-200);padding:.4rem 0;break-inside:avoid;width:47%;}
    .item-pdf img{width:72px;height:72px;object-fit:contain;border:1px solid var(--gray-200);flex-shrink:0;}
    .item-pdf .sem-foto{
      width:72px;height:72px;border:1px solid var(--gray-200);flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:var(--gray-400);
    }
    .item-pdf .txt{font-size:.74rem;line-height:1.3;}
    .item-pdf .cod{font-weight:700;}
    .item-pdf .preco-pdf{font-weight:700;color:var(--navy-900);}
    .item-pdf .preco-pdf .antigo{font-weight:400;color:var(--navy-600);text-decoration:line-through;margin-right:.3em;}
    .item-pdf .preco-pdf .etiqueta{background:var(--orange);color:var(--white);font-weight:700;padding:0 .3em;border-radius:3px;font-size:.9em;margin-left:.3em;}
  }

</style>
<style>
  .rodape-site{
    display:none;background:var(--navy-900);color:var(--gray-200);
    padding:.7rem 1rem;font-size:.78rem;
    position:fixed;left:0;right:0;bottom:0;z-index:120;
    box-shadow:0 -4px 14px rgba(0,0,0,.2);
  }
  .rodape-conteudo{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.5rem 0;}
  .rodape-bloco{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.35rem 1rem;padding:0 1.1rem;}
  .rodape-bloco:not(:last-child){border-right:1px solid rgba(255,255,255,.15);}
  .rodape-bloco span.rodape-item,
  .rodape-bloco a{display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap;color:var(--gray-200);text-decoration:none;font-size:.78rem;line-height:1.3;}
  .rodape-bloco a:hover{color:var(--gold);text-decoration:underline;}
  .rodape-site svg{flex-shrink:0;}
  .rodape-creditos{max-width:1200px;margin:.4rem auto 0;padding-top:.35rem;border-top:1px solid var(--navy-800);text-align:center;font-size:.68rem;color:var(--gray-400);}
  .rodape-creditos a{color:var(--gray-400);text-decoration:underline;}
  @media print{ .rodape-site{display:none !important;} }
  @media (max-width:700px){
    body{padding-bottom:9rem;}
    .rodape-site{font-size:.74rem;padding:.65rem .9rem;}
    .rodape-conteudo{flex-direction:column;gap:.5rem;}
    .rodape-bloco{border-right:none !important;padding:0;width:100%;}
    .rodape-bloco:not(:last-child){padding-bottom:.5rem;border-bottom:1px solid rgba(255,255,255,.12);}
  }
</style>
</head>
<body>

<div class="faixa-topo"></div>

<header class="topo">
  <img id="logo-img" src="" alt="">
  <p>Consulte nossos produtos e monte seu orçamento — envie direto pelo WhatsApp</p>
</header>

<div class="barra-busca-wrap">
  <div class="barra-busca">
    <div class="campo-busca">
      <span aria-hidden="true">🔍</span>
      <input type="search" id="campo-pesquisa" placeholder="Buscar por código ou descrição do produto..." aria-label="Buscar produto" autocomplete="off">
    </div>
    <div class="linha-categoria-carrinho">
      <select id="filtro-categoria" aria-label="Filtrar por categoria">
        <option value="">Todas as categorias</option>
      </select>
      <button class="carrinho-flutuante" id="carrinho-flutuante" aria-label="Ver orçamento">
        🛒<span class="carrinho-badge" id="carrinho-badge" style="display:none;">0</span>
      </button>
    </div>
    <div class="linha-info">
      <span id="contador-busca" class="contador"></span>
      <button class="btn-pdf" id="btn-pdf" title="Gerar o catálogo completo em PDF">🖨️ PDF do catálogo</button>
    </div>
  </div>
</div>

<main class="grid" id="grid-produtos"></main>
<div class="sentinela" id="sentinela"></div>

<button class="btn-topo" id="btn-topo" aria-label="Voltar ao topo" title="Voltar ao topo">↑</button>

<div class="mensagem-flutuante" id="mensagem-flutuante" role="status" aria-live="polite"></div>


<footer class="rodape-site" id="rodape-site">
  <div class="rodape-conteudo">
    <div class="rodape-bloco" id="rodape-endereco"></div>
    <div class="rodape-bloco rodape-vendedores" id="rodape-vendedores"></div>
    <div class="rodape-bloco rodape-redes" id="rodape-redes"></div>
  </div>
  <div class="rodape-creditos" id="rodape-creditos"></div>
</footer>

<div id="area-impressao" aria-hidden="true"></div>


<div class="modal" id="modal-orcamento">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Seu orçamento</h2>
      <button class="btn-fechar-x" id="btn-fechar-x" aria-label="Fechar">✕</button>
    </div>
    <table class="tabela-orcamento" id="tabela-orcamento">
      <thead><tr><th>Cód</th><th>Descrição</th><th class="col-preco-orcamento">Preço unit.</th><th>Qtd</th><th class="col-preco-orcamento">Subtotal</th><th></th></tr></thead>
      <tbody id="lista-orcamento"></tbody>
    </table>
    <p class="total-orcamento col-preco-orcamento" id="total-orcamento" style="display:none;"></p>
    <div class="secao-vendedores">
      <p>Enviar este orçamento para:</p>
      <div class="botoes-vendedores" id="botoes-vendedores"></div>
    </div>
    <div class="rodape-modal">
      <button class="btn-limpar" id="btn-limpar">Limpar tudo</button>
      <button class="btn-continuar" id="btn-continuar">Continuar comprando</button>
    </div>
  </div>
</div>

<script src="produtos.js"></script>
<script>
(function(){
  "use strict";

  // Aplica dados do config.js no cabeçalho (logo, alt, subtítulo)
  if (typeof SITE_CONFIG !== "undefined") {
    var logoHeader = document.getElementById("logo-img");
    if (logoHeader) {
      logoHeader.src = SITE_CONFIG.logoBase64 || "";
      logoHeader.alt = SITE_CONFIG.logoAlt || SITE_CONFIG.nome || "";
    }
  }

  // Base de dados completa: 942 produtos [codigo, descricao]
  // Base de dados carregada de produtos.js (var PRODUTOS_DADOS).
  // Cada item: {codigo, descricao, categoria, ativo}
  var DADOS = (typeof PRODUTOS_DADOS !== "undefined") ? PRODUTOS_DADOS : [];

  var PRODUTOS = [];          // [codigo, descricao] só dos produtos ativos
  var PRODUTOS_MAP = new Map();   // codigo -> descricao
  var CATEGORIA_MAP = new Map();  // codigo -> categoria
  var PRECO_MAP = new Map();      // codigo -> {preco, precoPromocional}
  var CATEGORIAS_DISPONIVEIS = [];
  (function () {
    var vistas = new Set();
    // Ordem alfabética por descrição dentro de cada categoria: facilita achar
    // o item (produtos parecidos ficam juntos), o que ajuda mais na conversão
    // do que ordenar por código (que é só a ordem que entrou no sistema).
    DADOS.slice().sort(function (a, b) { return a.descricao.localeCompare(b.descricao, "pt-BR"); }).forEach(function (p) {
      if (!p.ativo) return;
      PRODUTOS.push([p.codigo, p.descricao]);
      PRODUTOS_MAP.set(String(p.codigo), p.descricao);
      CATEGORIA_MAP.set(String(p.codigo), p.categoria || "Outros");
      PRECO_MAP.set(String(p.codigo), {
        preco: (typeof p.preco === "number") ? p.preco : null,
        precoPromocional: (typeof p.precoPromocional === "number") ? p.precoPromocional : null
      });
      if (!vistas.has(p.categoria)) { vistas.add(p.categoria); CATEGORIAS_DISPONIVEIS.push(p.categoria || "Outros"); }
    });
    CATEGORIAS_DISPONIVEIS.sort();
  })();

  // Preço e promoção: tudo desligado por padrão. mostrarPromocoes só faz
  // sentido se mostrarPrecos também estiver ligado.
  var MOSTRAR_PRECOS = typeof SITE_CONFIG !== "undefined" && !!SITE_CONFIG.mostrarPrecos;
  var MOSTRAR_PROMOCOES = MOSTRAR_PRECOS && typeof SITE_CONFIG !== "undefined" && !!SITE_CONFIG.mostrarPromocoes;

  function formatarMoeda(valor) {
    return "R$ " + valor.toFixed(2).replace(".", ",");
  }

  // Decide o que mostrar de preço pra um código: se tem promoção válida
  // (preço promocional menor que o preço cheio) e mostrarPromocoes está
  // ligado, usa ela; senão usa o preço normal.
  function obterPrecoInfo(codigo) {
    var p = PRECO_MAP.get(String(codigo));
    if (!MOSTRAR_PRECOS || !p) return { temPreco: false };
    var temOriginal = typeof p.preco === "number";
    var temPromo = MOSTRAR_PROMOCOES && typeof p.precoPromocional === "number" && (!temOriginal || p.precoPromocional < p.preco);
    return {
      temPreco: temOriginal || temPromo,
      precoOriginal: temOriginal ? p.preco : null,
      precoFinal: temPromo ? p.precoPromocional : (temOriginal ? p.preco : null),
      emPromocao: !!(temPromo && temOriginal)
    };
  }

  var filtroCategoria = document.getElementById("filtro-categoria");
  CATEGORIAS_DISPONIVEIS.forEach(function (cat) {
    var opt = document.createElement("option");
    opt.value = cat; opt.textContent = cat;
    filtroCategoria.appendChild(opt);
  });

  var CHAVE_CARRINHO = "topmix_orcamento_v1";
  var TAMANHO_PAGINA = 60;
  var LIMITE_QTD = 999;

  var carrinho = carregarCarrinho();
  var listaFiltrada = PRODUTOS;
  var paginaAtual = 0;

  var grid = document.getElementById("grid-produtos");
  var contador = document.getElementById("contador-busca");
  var campoPesquisa = document.getElementById("campo-pesquisa");
  var carrinhoBadge = document.getElementById("carrinho-badge");
  var modal = document.getElementById("modal-orcamento");
  var tbody = document.getElementById("lista-orcamento");
  var btnTopo = document.getElementById("btn-topo");
  var btnPdf = document.getElementById("btn-pdf");
  var areaImpressao = document.getElementById("area-impressao");
  var elMensagem = document.getElementById("mensagem-flutuante");
  var timeoutMensagem = null;

  // Registra um evento no Google Analytics (se estiver configurado); se não
  // estiver, simplesmente não faz nada -- nenhuma outra parte do catálogo
  // precisa se preocupar em checar se o analytics está ligado ou não.
  function registrarEvento(nome, parametros) {
    if (typeof window.gtag === "function") window.gtag("event", nome, parametros || {});
  }

  function mostrarMensagem(texto) {
    elMensagem.textContent = texto;
    elMensagem.classList.add("visivel");
    clearTimeout(timeoutMensagem);
    timeoutMensagem = setTimeout(function () { elMensagem.classList.remove("visivel"); }, 2400);
  }

  // Aceita só dígitos e nunca deixa passar de LIMITE_QTD; avisa quando corrige algo
  function sanitizarQuantidade(valorBruto) {
    var somenteNumeros = valorBruto.replace(/[^0-9]/g, "");
    var teveLetra = somenteNumeros.length !== valorBruto.length;
    var excedeu = false;
    if (somenteNumeros !== "") {
      var n = parseInt(somenteNumeros, 10);
      if (n > LIMITE_QTD) { n = LIMITE_QTD; excedeu = true; }
      somenteNumeros = String(n);
    }
    return { valor: somenteNumeros, teveLetra: teveLetra, excedeu: excedeu };
  }

  function carregarCarrinho() {
    try {
      var salvo = JSON.parse(localStorage.getItem(CHAVE_CARRINHO) || "[]");
      return salvo.filter(function (item) { return PRODUTOS_MAP.has(String(item.codigo)); });
    } catch (e) { return []; }
  }

  function salvarCarrinho() {
    try { localStorage.setItem(CHAVE_CARRINHO, JSON.stringify(carrinho)); } catch (e) {}
  }

  function normalizar(texto) {
    return String(texto).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function criarCard(produto) {
    var codigo = produto[0], descricao = produto[1];
    var card = document.createElement("div");
    card.className = "produto-card";
    card.dataset.codigo = codigo;
    card.innerHTML =
      '<div class="produto-imagem-container">' +
        '<span class="img-placeholder" aria-hidden="true">🧰</span>' +
        '<img class="produto-foto" loading="lazy" decoding="async">' +
        '<span class="badge-carrinho">🛒 <span class="badge-carrinho-qtd"></span></span>' +
      '</div>' +
      '<div class="produto-info">' +
        '<span class="produto-codigo"></span>' +
        '<h2 class="produto-descricao"></h2>' +
        '<div class="produto-preco">' +
          '<span class="preco-antigo"></span>' +
          '<span class="preco-atual"></span>' +
          '<span class="etiqueta-oferta">🔥 OFERTA</span>' +
        '</div>' +
        '<div class="stepper">' +
          '<button type="button" class="btn-qtd" data-acao="menos" aria-label="Diminuir quantidade">−</button>' +
          '<input type="text" class="qtd-input-card" value="1" inputmode="numeric" pattern="[0-9]*" maxlength="3" aria-label="Quantidade">' +
          '<button type="button" class="btn-qtd" data-acao="mais" aria-label="Aumentar quantidade">+</button>' +
        '</div>' +
        '<button type="button" class="btn-add">+ Adicionar ao orçamento</button>' +
      '</div>';

    card.querySelector(".produto-codigo").textContent = "CÓD " + codigo;
    var titulo = card.querySelector(".produto-descricao");
    titulo.textContent = descricao;

    var img = card.querySelector(".produto-foto");
    img.alt = descricao;
    img.src = "img/" + codigo + ".jpg";
    img.addEventListener("load", function () { img.classList.add("carregada"); });
    img.addEventListener("error", function () { img.style.display = "none"; });

    var infoPreco = obterPrecoInfo(codigo);
    if (infoPreco.temPreco) {
      var blocoPreco = card.querySelector(".produto-preco");
      blocoPreco.style.display = "flex";
      var elAtual = blocoPreco.querySelector(".preco-atual");
      var elAntigo = blocoPreco.querySelector(".preco-antigo");
      var elEtiqueta = blocoPreco.querySelector(".etiqueta-oferta");
      elAtual.textContent = formatarMoeda(infoPreco.precoFinal);
      if (infoPreco.emPromocao) {
        elAntigo.textContent = formatarMoeda(infoPreco.precoOriginal);
        elAntigo.style.display = "inline";
        elEtiqueta.style.display = "inline-block";
      }
    }

    atualizarEstadoCarrinhoCard(codigo, card);
    return card;
  }

  // Texto do botão "Adicionar" conforme o produto já estar ou não no carrinho
  function rotuloBotaoAdd(qtdNoCarrinho) {
    return qtdNoCarrinho ? "✓ No orçamento (" + qtdNoCarrinho + ")" : "+ Adicionar ao orçamento";
  }

  // Atualiza a aparência de UM card (borda, selo do carrinho, texto do botão)
  // conforme o estado atual do carrinho. Chamada ao criar o card e sempre
  // que o carrinho muda.
  function atualizarEstadoCarrinhoCard(codigo, cardJaEncontrado) {
    var card = cardJaEncontrado || grid.querySelector('.produto-card[data-codigo="' + String(codigo).replace(/"/g, '\\"') + '"]');
    if (!card) return;
    var item = carrinho.find(function (i) { return String(i.codigo) === String(codigo); });
    var btnAdd = card.querySelector(".btn-add");
    var badgeQtd = card.querySelector(".badge-carrinho-qtd");
    card.classList.toggle("no-carrinho", !!item);
    if (btnAdd && !btnAdd.classList.contains("confirmado")) {
      btnAdd.textContent = rotuloBotaoAdd(item ? item.qtd : 0);
      btnAdd.classList.toggle("no-carrinho", !!item);
    }
    if (badgeQtd) badgeQtd.textContent = item ? item.qtd : "";
  }

  // Ressincroniza todos os cards já renderizados na tela (usado quando o
  // carrinho muda por uma ação feita no modal de orçamento, e não sabemos
  // de antemão qual card específico foi afetado).
  function atualizarTodosCardsCarrinho() {
    grid.querySelectorAll(".produto-card").forEach(function (card) {
      atualizarEstadoCarrinhoCard(card.dataset.codigo, card);
    });
  }

  function renderizarPagina() {
    var inicio = paginaAtual * TAMANHO_PAGINA;
    var pagina = listaFiltrada.slice(inicio, inicio + TAMANHO_PAGINA);
    if (pagina.length === 0 && paginaAtual === 0) {
      grid.innerHTML = '<div class="vazio">Nenhum produto encontrado. Tente outro termo de busca.</div>';
      return;
    }
    var frag = document.createDocumentFragment();
    pagina.forEach(function (p) { frag.appendChild(criarCard(p)); });
    grid.appendChild(frag);
    paginaAtual++;
  }

  function atualizarContador(termo, categoria) {
    if (!termo && !categoria) {
      contador.textContent = PRODUTOS.length + " produtos no catálogo";
    } else if (categoria && !termo) {
      contador.textContent = listaFiltrada.length + ' em "' + categoria + '"';
    } else if (termo && !categoria) {
      contador.textContent = listaFiltrada.length + ' resultado(s) para "' + termo + '"';
    } else {
      contador.textContent = listaFiltrada.length + ' resultado(s) para "' + termo + '" em "' + categoria + '"';
    }
  }

  // Palavras de ligação que o cliente digita naturalmente, mas que quase
  // nunca aparecem na descrição do produto (ex: "lixa PARA hookit" -- a
  // descrição real provavelmente não tem a palavra "para"). Ignorá-las evita
  // que uma preposição sozinha trave a busca inteira.
  var PALAVRAS_IGNORADAS_BUSCA = new Set([
    "de", "da", "do", "das", "dos", "para", "pra", "com", "sem", "em",
    "e", "ou", "a", "o", "as", "os", "um", "uma", "uns", "umas",
    "no", "na", "nos", "nas", "ao", "aos", "à", "às"
  ]);

  function filtrarEProduzir() {
    var termoOriginal = campoPesquisa.value.trim();
    var termo = normalizar(termoOriginal);
    var todasPalavras = termo.split(/\s+/).filter(Boolean);
    var palavrasBusca = todasPalavras.filter(function (p) { return !PALAVRAS_IGNORADAS_BUSCA.has(p); });
    // Se sobrar só palavra de ligação (ex: buscou só "para"), usa como digitado
    // mesmo, pra busca não virar "mostrar tudo" sem o cliente esperar isso.
    if (!palavrasBusca.length) palavrasBusca = todasPalavras;
    var categoria = filtroCategoria.value;
    listaFiltrada = PRODUTOS.filter(function (p) {
      var descNorm = normalizar(p[1]);
      var codNorm = String(p[0]);
      // Cada palavra (que não seja de ligação) precisa aparecer em algum
      // lugar (código ou descrição), mas não precisa ser na ordem digitada
      // nem uma coladinha na outra -- assim "flap cgw" encontra
      // "DISCO FLAP FIBRA CGW 180MM", e "lixa para hookit" encontra uma
      // descrição que só tem "lixa" e "hookit", sem a palavra "para".
      var passaTexto = palavrasBusca.every(function (palavra) {
        return codNorm.indexOf(palavra) !== -1 || descNorm.indexOf(palavra) !== -1;
      });
      var passaCategoria = !categoria || CATEGORIA_MAP.get(String(p[0])) === categoria;
      return passaTexto && passaCategoria;
    });
    paginaAtual = 0;
    grid.innerHTML = "";
    renderizarPagina();
    atualizarContador(termoOriginal, categoria);
    registrarBuscaComAtraso(termoOriginal, categoria);
  }

  // Só registra a busca no analytics depois de 1,2s sem mudanças (evita
  // mandar um evento a cada letra digitada) e nunca registra busca vazia.
  var timeoutAnalyticsBusca = null;
  function registrarBuscaComAtraso(termo, categoria) {
    clearTimeout(timeoutAnalyticsBusca);
    timeoutAnalyticsBusca = setTimeout(function () {
      if (!termo && !categoria) return;
      registrarEvento("busca_catalogo", {
        termo_busca: termo || "(vazio)",
        categoria: categoria || "(todas)"
      });
    }, 1200);
  }

  var timeoutBusca = null;
  campoPesquisa.addEventListener("input", function () {
    clearTimeout(timeoutBusca);
    timeoutBusca = setTimeout(filtrarEProduzir, 150);
  });
  filtroCategoria.addEventListener("change", filtrarEProduzir);

  var observador = new IntersectionObserver(function (entradas) {
    entradas.forEach(function (entrada) {
      if (entrada.isIntersecting && paginaAtual * TAMANHO_PAGINA < listaFiltrada.length) {
        renderizarPagina();
      }
    });
  }, { rootMargin: "400px" });
  observador.observe(document.getElementById("sentinela"));

  // Delegação de eventos no grid (leve: um único listener para todos os cards)
  grid.addEventListener("click", function (e) {
    var btnQtd = e.target.closest(".btn-qtd");
    if (btnQtd) {
      var input = btnQtd.parentElement.querySelector(".qtd-input-card");
      var valor = parseInt(input.value, 10) || 1;
      if (btnQtd.dataset.acao === "mais") {
        if (valor >= LIMITE_QTD) { mostrarMensagem("Quantidade máxima: 999 unidades."); valor = LIMITE_QTD; }
        else { valor += 1; }
      } else {
        valor = Math.max(1, valor - 1);
      }
      input.value = valor;
      return;
    }
    var btnAdd = e.target.closest(".btn-add");
    if (btnAdd) {
      var card = btnAdd.closest(".produto-card");
      var codigo = card.dataset.codigo;
      var inputQtd = card.querySelector(".qtd-input-card");
      var qtd = parseInt(inputQtd.value, 10);
      if (!qtd || qtd < 1) qtd = 1;
      if (qtd > LIMITE_QTD) qtd = LIMITE_QTD;
      adicionarAoCarrinho(codigo, qtd);
      inputQtd.value = 1;
      atualizarEstadoCarrinhoCard(codigo, card);
      btnAdd.textContent = "✓ Adicionado";
      btnAdd.classList.add("confirmado");
      setTimeout(function () {
        btnAdd.classList.remove("confirmado");
        atualizarEstadoCarrinhoCard(codigo, card);
      }, 900);
    }
  });

  // Sanitiza a quantidade enquanto o usuário digita (bloqueia letras, trava em 999)
  grid.addEventListener("input", function (e) {
    if (!e.target.classList.contains("qtd-input-card")) return;
    var r = sanitizarQuantidade(e.target.value);
    e.target.value = r.valor;
    if (r.excedeu) mostrarMensagem("Quantidade máxima: 999 unidades.");
    else if (r.teveLetra) mostrarMensagem("Digite apenas números.");
  });
  grid.addEventListener("focusout", function (e) {
    if (!e.target.classList.contains("qtd-input-card")) return;
    if (e.target.value === "" || parseInt(e.target.value, 10) < 1) e.target.value = 1;
  });

  function adicionarAoCarrinho(codigo, qtd) {
    var descricao = PRODUTOS_MAP.get(String(codigo));
    var item = carrinho.find(function (i) { return String(i.codigo) === String(codigo); });
    if (item) {
      item.qtd += qtd;
      if (item.qtd > LIMITE_QTD) { item.qtd = LIMITE_QTD; mostrarMensagem("Quantidade máxima de 999 atingida para este item."); }
    } else {
      carrinho.push({ codigo: codigo, descricao: descricao, qtd: qtd });
    }
    salvarCarrinho();
    atualizarBarra();
  }

  function atualizarBarra() {
    var totalUn = carrinho.reduce(function (acc, i) { return acc + i.qtd; }, 0);
    if (totalUn > 0) {
      carrinhoBadge.textContent = totalUn > 99 ? "99+" : totalUn;
      carrinhoBadge.style.display = "flex";
    } else {
      carrinhoBadge.style.display = "none";
    }
  }

  var totalOrcamentoEl = document.getElementById("total-orcamento");

  function renderizarTabela() {
    tbody.innerHTML = "";
    if (carrinho.length === 0) {
      var tr = document.createElement("tr");
      var td = document.createElement("td");
      td.colSpan = MOSTRAR_PRECOS ? 6 : 4; td.style.textAlign = "center"; td.style.padding = "1.5rem";
      td.textContent = "Nenhum produto selecionado.";
      tr.appendChild(td); tbody.appendChild(tr);
      totalOrcamentoEl.style.display = "none";
      return;
    }
    var frag = document.createDocumentFragment();
    var totalGeral = 0;
    carrinho.forEach(function (item, index) {
      var tr = document.createElement("tr");

      var tdCod = document.createElement("td"); tdCod.textContent = item.codigo;
      var tdDesc = document.createElement("td"); tdDesc.textContent = item.descricao;

      var infoPreco = obterPrecoInfo(item.codigo);
      var tdPrecoUnit = document.createElement("td"); tdPrecoUnit.className = "col-preco-orcamento";
      var tdSubtotal = document.createElement("td"); tdSubtotal.className = "col-preco-orcamento";
      if (infoPreco.temPreco) {
        tdPrecoUnit.textContent = formatarMoeda(infoPreco.precoFinal);
        var subtotal = infoPreco.precoFinal * item.qtd;
        tdSubtotal.textContent = formatarMoeda(subtotal);
        totalGeral += subtotal;
      }

      var tdQtd = document.createElement("td");
      var inputQtd = document.createElement("input");
      inputQtd.type = "text"; inputQtd.className = "qtd-input";
      inputQtd.inputMode = "numeric"; inputQtd.setAttribute("pattern", "[0-9]*"); inputQtd.maxLength = 3;
      inputQtd.value = item.qtd; inputQtd.dataset.index = index;
      tdQtd.appendChild(inputQtd);

      var tdAcao = document.createElement("td");
      var btnRem = document.createElement("button");
      btnRem.className = "btn-remover"; btnRem.textContent = "Remover"; btnRem.dataset.index = index;
      tdAcao.appendChild(btnRem);

      tr.appendChild(tdCod); tr.appendChild(tdDesc); tr.appendChild(tdPrecoUnit); tr.appendChild(tdQtd); tr.appendChild(tdSubtotal); tr.appendChild(tdAcao);
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);

    if (MOSTRAR_PRECOS && totalGeral > 0) {
      totalOrcamentoEl.textContent = "Total: " + formatarMoeda(totalGeral);
      totalOrcamentoEl.style.display = "block";
    } else {
      totalOrcamentoEl.style.display = "none";
    }
  }

  tbody.addEventListener("input", function (e) {
    if (!e.target.classList.contains("qtd-input")) return;
    var r = sanitizarQuantidade(e.target.value);
    e.target.value = r.valor;
    if (r.excedeu) mostrarMensagem("Quantidade máxima: 999 unidades.");
    else if (r.teveLetra) mostrarMensagem("Digite apenas números.");
  });

  tbody.addEventListener("change", function (e) {
    if (e.target.classList.contains("qtd-input")) {
      var idx = parseInt(e.target.dataset.index, 10);
      var n = parseInt(e.target.value, 10);
      if (!n || n < 1) n = 1;
      if (n > LIMITE_QTD) n = LIMITE_QTD;
      carrinho[idx].qtd = n;
      e.target.value = n;
      salvarCarrinho();
      atualizarBarra();
      atualizarTodosCardsCarrinho();
    }
  });

  tbody.addEventListener("click", function (e) {
    var btn = e.target.closest(".btn-remover");
    if (!btn) return;
    var idx = parseInt(btn.dataset.index, 10);
    carrinho.splice(idx, 1);
    salvarCarrinho();
    atualizarBarra();
    renderizarTabela();
    atualizarTodosCardsCarrinho();
  });

  document.getElementById("carrinho-flutuante").addEventListener("click", function () {
    renderizarTabela();
    modal.classList.add("aberto");
  });
  document.getElementById("btn-fechar-x").addEventListener("click", function () { modal.classList.remove("aberto"); });
  document.getElementById("btn-continuar").addEventListener("click", function () { modal.classList.remove("aberto"); });
  modal.addEventListener("click", function (e) { if (e.target === modal) modal.classList.remove("aberto"); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") modal.classList.remove("aberto"); });

  document.getElementById("btn-limpar").addEventListener("click", function () {
    if (carrinho.length === 0) return;
    if (confirm("Remover todos os produtos do orçamento?")) {
      carrinho = [];
      salvarCarrinho();
      atualizarBarra();
      renderizarTabela();
      atualizarTodosCardsCarrinho();
    }
  });

  // Cria os botões de vendedor a partir do config.js
  var containerVendedores = document.getElementById("botoes-vendedores");
  var nomeEmpresa = (typeof SITE_CONFIG !== "undefined" && SITE_CONFIG.nome) ? SITE_CONFIG.nome : "";
  var listaVendedores = (typeof SITE_CONFIG !== "undefined" && SITE_CONFIG.vendedores) ? SITE_CONFIG.vendedores : [];
  listaVendedores.forEach(function (v) {
    var btn = document.createElement("button");
    btn.className = "btn-whatsapp";
    btn.dataset.numero = v.numero;
    btn.dataset.nome = v.nome;
    btn.textContent = "📲 " + v.nome;
    btn.addEventListener("click", function () {
      if (carrinho.length === 0) { alert("Adicione produtos antes de enviar."); return; }
      var msg = "Olá " + v.nome + "! Gostaria de cotar os seguintes produtos" + (nomeEmpresa ? " da " + nomeEmpresa : "") + ":\n\n";
      var totalGeralMsg = 0;
      carrinho.forEach(function (i) {
        msg += "• Cód " + i.codigo + " - " + i.descricao + " (Qtd: " + i.qtd + ")";
        if (MOSTRAR_PRECOS) {
          var infoPrecoMsg = obterPrecoInfo(i.codigo);
          if (infoPrecoMsg.temPreco) {
            var subtotalMsg = infoPrecoMsg.precoFinal * i.qtd;
            totalGeralMsg += subtotalMsg;
            msg += " - " + formatarMoeda(infoPrecoMsg.precoFinal) + " un. = " + formatarMoeda(subtotalMsg);
          }
        }
        msg += "\n";
      });
      if (MOSTRAR_PRECOS && totalGeralMsg > 0) msg += "\n*Total: " + formatarMoeda(totalGeralMsg) + "*\n";
      var totalUnidades = carrinho.reduce(function (acc, i) { return acc + i.qtd; }, 0);
      registrarEvento("orcamento_enviado", {
        vendedor: v.nome,
        qtd_produtos: carrinho.length,
        qtd_unidades: totalUnidades
      });
      window.open("https://wa.me/" + v.numero + "?text=" + encodeURIComponent(msg), "_blank");
    });
    containerVendedores.appendChild(btn);
  });

  window.addEventListener("scroll", function () {
    btnTopo.classList.toggle("visivel", window.scrollY > 900);
  }, { passive: true });
  btnTopo.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });


  // Deixa o número mais legível pra exibir: de "5534984264335" pra "(34) 98426-4335"
  function formatarTelefoneExibicao(numero) {
    var digitos = String(numero || "").replace(/\D/g, "");
    if (digitos.length >= 12 && digitos.indexOf("55") === 0) digitos = digitos.slice(2);
    if (digitos.length === 11) return "(" + digitos.slice(0, 2) + ") " + digitos.slice(2, 7) + "-" + digitos.slice(7);
    if (digitos.length === 10) return "(" + digitos.slice(0, 2) + ") " + digitos.slice(2, 6) + "-" + digitos.slice(6);
    return numero;
  }

  // Pequenos ícones (SVG embutido, sem depender de internet nem de fontes externas)
  var ICONES_RODAPE = {
    local: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2C7.58 2 4 5.58 4 10c0 5.25 7 12 8 12s8-6.75 8-12c0-4.42-3.58-8-8-8zm0 10.5A2.5 2.5 0 1 1 12 7.5a2.5 2.5 0 0 1 0 5z"/></svg>',
    telefone: '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.2 1.1L6.6 10.8z"/></svg>',

    // Instagram: fundo em degradê (roxo -> rosa -> laranja) com a câmera em branco,
    // igual ao ícone oficial do app.
    instagram: '<svg viewBox="0 0 48 48" width="16" height="16"><defs><linearGradient id="gradInsta" x1="0%" y1="100%" x2="100%" y2="0%">' +
      '<stop offset="0%" stop-color="#FFDD55"/><stop offset="35%" stop-color="#FF543E"/><stop offset="70%" stop-color="#C837AB"/><stop offset="100%" stop-color="#5851DB"/>' +
      '</linearGradient></defs>' +
      '<rect width="48" height="48" rx="12" fill="url(#gradInsta)"/>' +
      '<rect x="13" y="13" width="22" height="22" rx="6" fill="none" stroke="#fff" stroke-width="2.6"/>' +
      '<circle cx="24" cy="24" r="6.2" fill="none" stroke="#fff" stroke-width="2.6"/>' +
      '<circle cx="32.3" cy="15.7" r="1.6" fill="#fff"/></svg>',

    // Facebook: "f" branco sobre círculo azul da marca.
    facebook: '<svg viewBox="0 0 48 48" width="16" height="16"><circle cx="24" cy="24" r="24" fill="#1877F2"/>' +
      '<path fill="#fff" d="M27 24.5h4l.6-4.6H27v-3c0-1.3.4-2.2 2.2-2.2h2.4V10c-.4-.1-1.8-.2-3.4-.2-3.4 0-5.7 2.1-5.7 5.9v3.3h-3.8v4.6h3.8V38h4.5V24.5z"/></svg>',

    // Google: o "G" colorido oficial.
    google: '<svg viewBox="0 0 48 48" width="16" height="16">' +
      '<path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.3 1 7.3 2.7l6-6C33.9 6.5 29.2 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.3-3.5z"/>' +
      '<path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13.5 24 13.5c2.8 0 5.3 1 7.3 2.7l6-6C33.9 6.5 29.2 4.5 24 4.5c-7.6 0-14.2 4.3-17.7 10.2z"/>' +
      '<path fill="#4CAF50" d="M24 43.5c5.1 0 9.7-1.9 13.2-5.1l-6.1-5.2c-2 1.5-4.5 2.3-7.1 2.3-5.2 0-9.6-3.5-11.2-8.3l-6.5 5C9.7 39.1 16.3 43.5 24 43.5z"/>' +
      '<path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.1 5.2C40.6 35.9 43.5 30.4 43.5 24c0-1.2-.1-2.4-.3-3.5z"/></svg>',

    // WhatsApp: telefone branco sobre círculo verde da marca.
    whatsapp: '<svg viewBox="0 0 48 48" width="16" height="16"><circle cx="24" cy="24" r="24" fill="#25D366"/>' +
      '<path fill="#fff" d="M32.5 27.1c-.5-.2-2.7-1.3-3.1-1.5-.4-.1-.7-.2-1 .2s-1.1 1.4-1.4 1.7-.5.3-1 .1a11.6 11.6 0 0 1-3.4-2.1 12.8 12.8 0 0 1-2.4-3c-.2-.4 0-.6.2-.8s.4-.5.6-.7.2-.4.3-.6 0-.5 0-.7c0-.2-1-2.4-1.3-3.3-.3-.8-.7-.7-1-.7h-.9c-.3 0-.7.1-1.1.5s-1.4 1.4-1.4 3.4 1.5 4 1.7 4.2c.2.3 3 4.5 7.1 6.3 4.1 1.7 4.1 1.2 4.9 1.1s2.5-1 2.8-2 .4-1.8.3-2c-.1-.2-.4-.3-.9-.5z"/>' +
      '<path fill="#fff" d="M24 6.5A17.5 17.5 0 0 0 8.3 32.4L6.5 39l6.8-1.8A17.5 17.5 0 1 0 24 6.5zm0 32a14.4 14.4 0 0 1-7.4-2l-.5-.3-4.4 1.2 1.2-4.3-.3-.5A14.5 14.5 0 1 1 24 38.5z"/></svg>'
  };

  function montarRodape() {
    var cfg = (typeof SITE_CONFIG !== "undefined") ? SITE_CONFIG : {};
    var rodapeEl = document.getElementById("rodape-site");
    var enderecoEl = document.getElementById("rodape-endereco");
    var vendedoresEl = document.getElementById("rodape-vendedores");
    var redesEl = document.getElementById("rodape-redes");
    var creditosEl = document.getElementById("rodape-creditos");
    var r = cfg.rodape || {};
    var temConteudo = false;

    // Endereço, por escrito
    if (r.endereco) {
      var spanEnd = document.createElement("span");
      spanEnd.className = "rodape-item";
      spanEnd.innerHTML = ICONES_RODAPE.local + " " + r.endereco;
      enderecoEl.appendChild(spanEnd);
      temConteudo = true;
    }

    // Vendedores: nome + número clicável, abre direto uma conversa no WhatsApp
    (cfg.vendedores || []).forEach(function (v) {
      if (!v || !v.numero) return;
      var a = document.createElement("a");
      a.href = "https://wa.me/" + v.numero;
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML = ICONES_RODAPE.whatsapp + " " + (v.nome ? v.nome + ": " : "") + formatarTelefoneExibicao(v.numero);
      vendedoresEl.appendChild(a);
      temConteudo = true;
    });

    // Contatos extras (financeiro, suporte etc.) -- aparecem no rodapé igual
    // aos vendedores, mas não entram como opção de enviar orçamento.
    ((r.contatosExtras) || []).forEach(function (v) {
      if (!v || !v.numero) return;
      var aExtra = document.createElement("a");
      aExtra.href = "https://wa.me/" + v.numero;
      aExtra.target = "_blank";
      aExtra.rel = "noopener";
      aExtra.innerHTML = ICONES_RODAPE.whatsapp + " " + (v.nome ? v.nome + ": " : "") + formatarTelefoneExibicao(v.numero);
      vendedoresEl.appendChild(aExtra);
      temConteudo = true;
    });

    // Redes sociais + página do Google -- endereço continua visível acima,
    // então o link do Google aqui é só um atalho extra pra página/avaliações.
    var redes = [
      { chave: "instagram", label: "Instagram", icone: ICONES_RODAPE.instagram },
      { chave: "facebook", label: "Facebook", icone: ICONES_RODAPE.facebook },
      { chave: "googleMaps", label: "Google", icone: ICONES_RODAPE.google }
    ];
    redes.forEach(function (rede) {
      if (!r[rede.chave]) return;
      var a = document.createElement("a");
      a.href = r[rede.chave];
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML = rede.icone + " " + rede.label;
      redesEl.appendChild(a);
      temConteudo = true;
    });

    if (temConteudo) rodapeEl.style.display = "block";

    if (cfg.creditos) {
      if (cfg.creditosLink) {
        var aCred = document.createElement("a");
        aCred.href = cfg.creditosLink;
        aCred.target = "_blank";
        aCred.rel = "noopener";
        aCred.textContent = cfg.creditos;
        creditosEl.appendChild(aCred);
      } else {
        creditosEl.textContent = cfg.creditos;
      }
      rodapeEl.style.display = "block";
    }
  }

  // Gera o PDF: monta uma capa + a lista completa (com fotos, quando existirem)
  // dentro de #area-impressao, espera as fotos tentarem carregar e chama window.print().
  function gerarPDF() {
    if (btnPdf.disabled) return;
    btnPdf.disabled = true;
    var textoOriginal = btnPdf.textContent;
    btnPdf.textContent = "Preparando PDF...";

    areaImpressao.innerHTML = "";

    var cfg = (typeof SITE_CONFIG !== "undefined") ? SITE_CONFIG : {};
    var promessas = [];

    // Mostra o progresso no próprio botão enquanto as fotos carregam --
    // catálogos grandes (muitas fotos) demoram mais, e assim o lojista vê
    // que está funcionando, não travado.
    var progressoFotos = { feitos: 0, total: 0 };
    function registrarProgressoFoto() {
      progressoFotos.feitos++;
      if (progressoFotos.total > 20) {
        btnPdf.textContent = "Preparando PDF... (" + progressoFotos.feitos + "/" + progressoFotos.total + ")";
      }
    }

    // Capa: usa a foto configurada em SITE_CONFIG.capaPdf.imagemCapa se ela
    // existir na pasta img/. Se não existir (ainda não foi colocada lá),
    // cai automaticamente na capa de texto (logo + título) como antes.
    function criarCapaTexto() {
      var capa = document.createElement("div");
      capa.className = "capa-pdf";
      var logoImg = document.createElement("img");
      logoImg.src = document.querySelector(".topo img").src;
      logoImg.alt = cfg.logoAlt || cfg.nome || "";
      var tituloDestaque = document.createElement("div");
      tituloDestaque.className = "titulo-destaque";
      tituloDestaque.textContent = "CATÁLOGO DE";
      var tituloPrincipal = document.createElement("div");
      tituloPrincipal.className = "titulo-principal";
      tituloPrincipal.textContent = "PRODUTOS " + (cfg.nome ? cfg.nome.toUpperCase() : "");
      var sub = document.createElement("p");
      sub.textContent = cfg.subtitulo || "";
      capa.appendChild(logoImg); capa.appendChild(tituloDestaque); capa.appendChild(tituloPrincipal); capa.appendChild(sub);
      return capa;
    }

    if (cfg.capaPdf && cfg.capaPdf.imagemCapa) {
      var capaFotoDiv = document.createElement("div");
      capaFotoDiv.className = "pagina-foto-cheia";
      var imgCapa = document.createElement("img");
      imgCapa.alt = "";
      promessas.push(new Promise(function (resolve) {
        imgCapa.addEventListener("load", function () { registrarProgressoFoto(); resolve(); });
        imgCapa.addEventListener("error", function () {
          capaFotoDiv.remove();
          areaImpressao.insertBefore(criarCapaTexto(), areaImpressao.firstChild);
          registrarProgressoFoto();
          resolve();
        });
        imgCapa.src = cfg.capaPdf.imagemCapa;
      }));
      capaFotoDiv.appendChild(imgCapa);
      areaImpressao.appendChild(capaFotoDiv);
    } else {
      areaImpressao.appendChild(criarCapaTexto());
    }

    // Ordem pensada pra conversão: começa pelos consumíveis que os clientes
    // recompram com mais frequência e urgência (eletrodo, disco, parafuso...),
    // e termina nos itens de compra mais espaçada e ticket mais alto (máquinas).
    var ORDEM_CATEGORIAS = [
      "Soldagem", "Abrasivos", "Fixadores e Química", "Brocas e Acessórios",
      "Tintas e Pintura", "EPI - Proteção", "Ferramentas Manuais",
      "Ferramentas Elétricas", "Máquinas e Equipamentos"
    ];
    var categoriaFiltroAtual = filtroCategoria.value;
    var porCategoria = new Map();
    PRODUTOS.forEach(function (p) {
      if (categoriaFiltroAtual && CATEGORIA_MAP.get(String(p[0])) !== categoriaFiltroAtual) return;
      var cat = CATEGORIA_MAP.get(String(p[0])) || "Outros";
      if (!porCategoria.has(cat)) porCategoria.set(cat, []);
      porCategoria.get(cat).push(p);
    });
    var categoriasOrdenadas = Array.from(porCategoria.keys()).sort(function (a, b) {
      var ia = ORDEM_CATEGORIAS.indexOf(a), ib = ORDEM_CATEGORIAS.indexOf(b);
      if (ia === -1) ia = 999; if (ib === -1) ib = 999;
      return ia !== ib ? ia - ib : a.localeCompare(b);
    });

    categoriasOrdenadas.forEach(function (cat, indiceCategoria) {
      var tituloCat = document.createElement("h2");
      tituloCat.className = "categoria-pdf-titulo" + (indiceCategoria > 0 ? " nova-pagina" : "");
      tituloCat.textContent = cat;
      areaImpressao.appendChild(tituloCat);

      var lista = document.createElement("div");
      lista.className = "lista-pdf";
      porCategoria.get(cat).forEach(function (p) {
        var item = document.createElement("div");
        item.className = "item-pdf";

        var img = document.createElement("img");
        img.alt = "";
        var semFoto = document.createElement("span");
        semFoto.className = "sem-foto";
        semFoto.textContent = "🧰";

        promessas.push(new Promise(function (resolve) {
          img.addEventListener("load", function () { semFoto.remove(); registrarProgressoFoto(); resolve(); });
          img.addEventListener("error", function () { img.remove(); registrarProgressoFoto(); resolve(); });
          img.src = "img/" + p[0] + ".jpg";
        }));

        var txt = document.createElement("div");
        txt.className = "txt";
        var cod = document.createElement("div"); cod.className = "cod"; cod.textContent = "Cód " + p[0];
        var desc = document.createElement("div"); desc.textContent = p[1];
        txt.appendChild(cod); txt.appendChild(desc);

        var infoPrecoPdf = obterPrecoInfo(p[0]);
        if (infoPrecoPdf.temPreco) {
          var precoLinha = document.createElement("div");
          precoLinha.className = "preco-pdf";
          if (infoPrecoPdf.emPromocao) {
            precoLinha.innerHTML =
              '<span class="antigo">' + formatarMoeda(infoPrecoPdf.precoOriginal) + '</span>' +
              formatarMoeda(infoPrecoPdf.precoFinal) +
              '<span class="etiqueta">OFERTA</span>';
          } else {
            precoLinha.textContent = formatarMoeda(infoPrecoPdf.precoFinal);
          }
          txt.appendChild(precoLinha);
        }

        item.appendChild(img); item.appendChild(semFoto); item.appendChild(txt);
        lista.appendChild(item);
      });
      areaImpressao.appendChild(lista);
    });

    // Contracapa: só aparece se SITE_CONFIG.capaPdf.imagemContracapa existir
    // na pasta img/. Se não existir, o catálogo simplesmente termina sem ela.
    if (cfg.capaPdf && cfg.capaPdf.imagemContracapa) {
      var contracapaDiv = document.createElement("div");
      contracapaDiv.className = "pagina-foto-cheia contracapa";
      var imgContra = document.createElement("img");
      imgContra.alt = "";
      promessas.push(new Promise(function (resolve) {
        imgContra.addEventListener("load", function () { registrarProgressoFoto(); resolve(); });
        imgContra.addEventListener("error", function () { contracapaDiv.remove(); registrarProgressoFoto(); resolve(); });
        imgContra.src = cfg.capaPdf.imagemContracapa;
      }));
      contracapaDiv.appendChild(imgContra);
      areaImpressao.appendChild(contracapaDiv);
    }

    // O tempo de espera cresce com a quantidade de fotos -- um catálogo com
    // centenas de produtos precisa de bem mais tempo pra carregar tudo do
    // que um com poucos itens. Sem isso, fotos que ainda estavam carregando
    // corriam risco de aparecer como "sem foto" no PDF só por causa do tempo.
    progressoFotos.total = promessas.length;
    var tempoLimiteMs = Math.min(45000, Math.max(8000, 4000 + progressoFotos.total * 40));
    var tempoLimite = new Promise(function (resolve) { setTimeout(resolve, tempoLimiteMs); });
    Promise.race([Promise.all(promessas), tempoLimite]).then(function () {
      btnPdf.textContent = textoOriginal;
      btnPdf.disabled = false;
      window.print();
    });
  }

  btnPdf.addEventListener("click", function () {
    registrarEvento("catalogo_pdf_baixado", { qtd_produtos_ativos: PRODUTOS.length });
    gerarPDF();
  });
  window.addEventListener("afterprint", function () { areaImpressao.innerHTML = ""; });

  // Inicialização
  document.getElementById("tabela-orcamento").classList.toggle("ocultar-precos", !MOSTRAR_PRECOS);
  renderizarPagina();
  atualizarContador("", "");
  atualizarBarra();
  montarRodape();
})();
</script>
